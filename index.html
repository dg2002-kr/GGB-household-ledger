<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>나의 가계부</title>
<style>
  :root {
    --bg: #f4f5f7;
    --card: #ffffff;
    --text: #1f2430;
    --muted: #767c8c;
    --border: #e6e8ee;
    --income: #1a9c6b;
    --income-bg: #e8f8f1;
    --expense: #e0463f;
    --expense-bg: #fdecec;
    --accent: #3f6df3;
    --accent-bg: #eef2ff;
    --radius: 14px;
    --shadow: 0 1px 3px rgba(20, 24, 40, 0.06), 0 1px 2px rgba(20, 24, 40, 0.04);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", -apple-system, sans-serif;
    padding: 24px 16px 60px;
  }

  .wrap {
    max-width: 880px;
    margin: 0 auto;
  }

  header {
    margin-bottom: 20px;
  }

  header h1 {
    font-size: 22px;
    margin: 0 0 4px;
  }

  header p {
    margin: 0;
    color: var(--muted);
    font-size: 13px;
  }

  .card {
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 20px;
    margin-bottom: 16px;
  }

  .summary-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    margin-bottom: 16px;
  }

  .summary-card {
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 16px;
    text-align: left;
  }

  .summary-card .label {
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 6px;
  }

  .summary-card .value {
    font-size: 19px;
    font-weight: 700;
  }

  .summary-card.income .value { color: var(--income); }
  .summary-card.expense .value { color: var(--expense); }
  .summary-card.balance .value { color: var(--accent); }

  .month-nav {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 14px;
    margin-bottom: 16px;
  }

  .month-nav button {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    width: 34px;
    height: 34px;
    font-size: 15px;
    cursor: pointer;
    color: var(--text);
  }

  .month-nav button:hover { background: var(--accent-bg); }

  .month-nav .month-label {
    font-size: 16px;
    font-weight: 700;
    min-width: 110px;
    text-align: center;
  }

  form.entry-form {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 10px;
    align-items: end;
  }

  .field {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .field label {
    font-size: 12px;
    color: var(--muted);
  }

  .field input,
  .field select {
    padding: 9px 10px;
    border-radius: 9px;
    border: 1px solid var(--border);
    font-size: 14px;
    background: #fafbfc;
    color: var(--text);
    font-family: inherit;
  }

  .field input:focus,
  .field select:focus {
    outline: none;
    border-color: var(--accent);
    background: #fff;
  }

  .type-toggle {
    display: flex;
    border: 1px solid var(--border);
    border-radius: 9px;
    overflow: hidden;
  }

  .type-toggle button {
    flex: 1;
    padding: 9px 0;
    border: none;
    background: #fafbfc;
    color: var(--muted);
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
  }

  .type-toggle button.active[data-type="income"] {
    background: var(--income-bg);
    color: var(--income);
  }

  .type-toggle button.active[data-type="expense"] {
    background: var(--expense-bg);
    color: var(--expense);
  }

  .submit-btn {
    grid-column: span 1;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 9px;
    padding: 10px 0;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
  }

  .submit-btn:hover { filter: brightness(1.06); }

  .section-title {
    font-size: 14px;
    font-weight: 700;
    margin: 4px 0 12px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .filter-row {
    display: flex;
    gap: 8px;
  }

  .filter-row button {
    border: 1px solid var(--border);
    background: #fafbfc;
    padding: 5px 12px;
    border-radius: 999px;
    font-size: 12px;
    cursor: pointer;
    color: var(--muted);
  }

  .filter-row button.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
  }

  thead th {
    text-align: left;
    color: var(--muted);
    font-weight: 600;
    font-size: 12px;
    padding: 8px 6px;
    border-bottom: 1px solid var(--border);
  }

  tbody td {
    padding: 10px 6px;
    border-bottom: 1px solid var(--border);
    vertical-align: middle;
  }

  tbody tr:last-child td { border-bottom: none; }

  .badge {
    display: inline-block;
    padding: 3px 9px;
    border-radius: 999px;
    font-size: 11px;
    font-weight: 700;
  }

  .badge.income { background: var(--income-bg); color: var(--income); }
  .badge.expense { background: var(--expense-bg); color: var(--expense); }

  .amount { font-weight: 700; text-align: right; white-space: nowrap; }
  .amount.income { color: var(--income); }
  .amount.expense { color: var(--expense); }

  .memo { color: var(--muted); }

  .del-btn {
    background: none;
    border: none;
    color: var(--muted);
    cursor: pointer;
    font-size: 16px;
    line-height: 1;
    padding: 4px;
  }

  .del-btn:hover { color: var(--expense); }

  .empty {
    text-align: center;
    color: var(--muted);
    padding: 30px 0;
    font-size: 13px;
  }

  .cat-breakdown {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .cat-row {
    display: grid;
    grid-template-columns: 80px 1fr 90px;
    align-items: center;
    gap: 10px;
    font-size: 13px;
  }

  .cat-row .bar-track {
    background: var(--border);
    border-radius: 999px;
    height: 8px;
    overflow: hidden;
  }

  .cat-row .bar-fill {
    height: 100%;
    background: var(--accent);
    border-radius: 999px;
  }

  .cat-row .cat-amount {
    text-align: right;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
  }

  @media (max-width: 720px) {
    .summary-grid { grid-template-columns: 1fr; }
    form.entry-form { grid-template-columns: repeat(2, 1fr); }
    .submit-btn { grid-column: span 2; }
    table, thead, tbody, th, td, tr { display: block; }
    thead { display: none; }
    tbody tr {
      border-bottom: 1px solid var(--border);
      padding: 10px 0;
    }
    tbody td {
      border: none;
      padding: 2px 0;
      display: flex;
      justify-content: space-between;
    }
    tbody td::before {
      content: attr(data-label);
      color: var(--muted);
      font-size: 12px;
    }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>나의 가계부</h1>
    <p>수입과 지출을 기록하고 한눈에 확인하세요. 데이터는 이 브라우저에 자동 저장됩니다.</p>
  </header>

  <div class="month-nav">
    <button id="prevMonth" aria-label="이전 달">‹</button>
    <div class="month-label" id="monthLabel"></div>
    <button id="nextMonth" aria-label="다음 달">›</button>
  </div>

  <div class="summary-grid">
    <div class="summary-card income">
      <div class="label">이번 달 수입</div>
      <div class="value" id="sumIncome">0원</div>
    </div>
    <div class="summary-card expense">
      <div class="label">이번 달 지출</div>
      <div class="value" id="sumExpense">0원</div>
    </div>
    <div class="summary-card balance">
      <div class="label">잔액</div>
      <div class="value" id="sumBalance">0원</div>
    </div>
  </div>

  <div class="card">
    <div class="section-title">내역 추가</div>
    <form class="entry-form" id="entryForm">
      <div class="field" style="grid-column: span 1;">
        <label>구분</label>
        <div class="type-toggle" id="typeToggle">
          <button type="button" data-type="expense" class="active">지출</button>
          <button type="button" data-type="income">수입</button>
        </div>
      </div>
      <div class="field">
        <label for="date">날짜</label>
        <input type="date" id="date" required>
      </div>
      <div class="field">
        <label for="category">카테고리</label>
        <select id="category"></select>
      </div>
      <div class="field" style="grid-column: span 2;">
        <label for="memo">메모</label>
        <input type="text" id="memo" placeholder="예: 점심 식사">
      </div>
      <div class="field">
        <label for="amount">금액</label>
        <input type="number" id="amount" min="0" placeholder="0" required>
      </div>
      <button type="submit" class="submit-btn">추가</button>
    </form>
  </div>

  <div class="card">
    <div class="section-title">카테고리별 지출</div>
    <div class="cat-breakdown" id="catBreakdown"></div>
  </div>

  <div class="card">
    <div class="section-title">
      <span>내역</span>
      <div class="filter-row" id="filterRow">
        <button data-filter="all" class="active">전체</button>
        <button data-filter="income">수입</button>
        <button data-filter="expense">지출</button>
      </div>
    </div>
    <table>
      <thead>
        <tr>
          <th>날짜</th>
          <th>구분</th>
          <th>카테고리</th>
          <th>메모</th>
          <th style="text-align:right;">금액</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="txBody"></tbody>
    </table>
    <div class="empty" id="emptyMsg" style="display:none;">이번 달 내역이 없습니다.</div>
  </div>
</div>

<script>
(function () {
  "use strict";

  var STORAGE_KEY = "gagyebu_transactions_v1";

  var CATEGORIES = {
    expense: ["식비", "교통", "주거/관리비", "통신", "의료/건강", "교육", "문화/여가", "쇼핑", "경조사", "기타"],
    income: ["급여", "용돈", "부수입", "이자/투자", "기타"]
  };

  var state = {
    transactions: loadTransactions(),
    currentType: "expense",
    filter: "all",
    viewDate: new Date()
  };

  var dateInput = document.getElementById("date");
  var categorySelect = document.getElementById("category");
  var memoInput = document.getElementById("memo");
  var amountInput = document.getElementById("amount");
  var entryForm = document.getElementById("entryForm");
  var typeToggle = document.getElementById("typeToggle");
  var filterRow = document.getElementById("filterRow");
  var txBody = document.getElementById("txBody");
  var emptyMsg = document.getElementById("emptyMsg");
  var monthLabel = document.getElementById("monthLabel");
  var catBreakdown = document.getElementById("catBreakdown");

  function loadTransactions() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : [];
    } catch (e) {
      return [];
    }
  }

  function saveTransactions() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state.transactions));
    } catch (e) {
      /* localStorage unavailable; state stays in memory for this session */
    }
  }

  function formatWon(n) {
    return n.toLocaleString("ko-KR") + "원";
  }

  function todayISO() {
    var d = new Date();
    d.setMinutes(d.getMinutes() - d.getTimezoneOffset());
    return d.toISOString().slice(0, 10);
  }

  function populateCategories() {
    var list = CATEGORIES[state.currentType];
    categorySelect.innerHTML = "";
    list.forEach(function (cat) {
      var opt = document.createElement("option");
      opt.value = cat;
      opt.textContent = cat;
      categorySelect.appendChild(opt);
    });
  }

  function setType(type) {
    state.currentType = type;
    Array.prototype.forEach.call(typeToggle.querySelectorAll("button"), function (btn) {
      btn.classList.toggle("active", btn.dataset.type === type);
    });
    populateCategories();
  }

  typeToggle.addEventListener("click", function (e) {
    var btn = e.target.closest("button");
    if (!btn) return;
    setType(btn.dataset.type);
  });

  filterRow.addEventListener("click", function (e) {
    var btn = e.target.closest("button");
    if (!btn) return;
    state.filter = btn.dataset.filter;
    Array.prototype.forEach.call(filterRow.querySelectorAll("button"), function (b) {
      b.classList.toggle("active", b === btn);
    });
    render();
  });

  document.getElementById("prevMonth").addEventListener("click", function () {
    state.viewDate.setMonth(state.viewDate.getMonth() - 1);
    render();
  });

  document.getElementById("nextMonth").addEventListener("click", function () {
    state.viewDate.setMonth(state.viewDate.getMonth() + 1);
    render();
  });

  entryForm.addEventListener("submit", function (e) {
    e.preventDefault();
    var amount = parseInt(amountInput.value, 10);
    if (!dateInput.value || !amount || amount <= 0) return;

    state.transactions.push({
      id: Date.now() + "-" + Math.random().toString(36).slice(2, 7),
      type: state.currentType,
      date: dateInput.value,
      category: categorySelect.value,
      memo: memoInput.value.trim(),
      amount: amount
    });

    saveTransactions();

    var enteredDate = new Date(dateInput.value + "T00:00:00");
    state.viewDate = new Date(enteredDate.getFullYear(), enteredDate.getMonth(), 1);

    memoInput.value = "";
    amountInput.value = "";
    dateInput.value = todayISO();
    render();
  });

  txBody.addEventListener("click", function (e) {
    var btn = e.target.closest(".del-btn");
    if (!btn) return;
    var id = btn.dataset.id;
    state.transactions = state.transactions.filter(function (t) { return t.id !== id; });
    saveTransactions();
    render();
  });

  function monthKey(date) {
    return date.getFullYear() + "-" + String(date.getMonth() + 1).padStart(2, "0");
  }

  function getMonthTransactions() {
    var key = monthKey(state.viewDate);
    return state.transactions.filter(function (t) {
      return t.date.slice(0, 7) === key;
    });
  }

  function render() {
    monthLabel.textContent = state.viewDate.getFullYear() + "년 " + (state.viewDate.getMonth() + 1) + "월";

    var monthTx = getMonthTransactions();
    var income = 0, expense = 0;
    monthTx.forEach(function (t) {
      if (t.type === "income") income += t.amount;
      else expense += t.amount;
    });

    document.getElementById("sumIncome").textContent = formatWon(income);
    document.getElementById("sumExpense").textContent = formatWon(expense);
    document.getElementById("sumBalance").textContent = formatWon(income - expense);

    var filtered = monthTx.filter(function (t) {
      if (state.filter === "all") return true;
      return t.type === state.filter;
    }).sort(function (a, b) {
      return b.date.localeCompare(a.date);
    });

    txBody.innerHTML = "";
    emptyMsg.style.display = filtered.length ? "none" : "block";

    filtered.forEach(function (t) {
      var tr = document.createElement("tr");

      var tdDate = document.createElement("td");
      tdDate.dataset.label = "날짜";
      tdDate.textContent = t.date;

      var tdType = document.createElement("td");
      tdType.dataset.label = "구분";
      var badge = document.createElement("span");
      badge.className = "badge " + t.type;
      badge.textContent = t.type === "income" ? "수입" : "지출";
      tdType.appendChild(badge);

      var tdCat = document.createElement("td");
      tdCat.dataset.label = "카테고리";
      tdCat.textContent = t.category;

      var tdMemo = document.createElement("td");
      tdMemo.dataset.label = "메모";
      tdMemo.className = "memo";
      tdMemo.textContent = t.memo || "-";

      var tdAmount = document.createElement("td");
      tdAmount.dataset.label = "금액";
      tdAmount.className = "amount " + t.type;
      tdAmount.textContent = (t.type === "income" ? "+" : "-") + formatWon(t.amount);

      var tdDel = document.createElement("td");
      var delBtn = document.createElement("button");
      delBtn.className = "del-btn";
      delBtn.dataset.id = t.id;
      delBtn.textContent = "✕";
      delBtn.title = "삭제";
      tdDel.appendChild(delBtn);

      tr.appendChild(tdDate);
      tr.appendChild(tdType);
      tr.appendChild(tdCat);
      tr.appendChild(tdMemo);
      tr.appendChild(tdAmount);
      tr.appendChild(tdDel);
      txBody.appendChild(tr);
    });

    renderCategoryBreakdown(monthTx, expense);
  }

  function renderCategoryBreakdown(monthTx, totalExpense) {
    var byCat = {};
    monthTx.forEach(function (t) {
      if (t.type !== "expense") return;
      byCat[t.category] = (byCat[t.category] || 0) + t.amount;
    });

    var entries = Object.keys(byCat).map(function (cat) {
      return { cat: cat, amount: byCat[cat] };
    }).sort(function (a, b) { return b.amount - a.amount; });

    catBreakdown.innerHTML = "";

    if (!entries.length) {
      var empty = document.createElement("div");
      empty.className = "empty";
      empty.style.padding = "8px 0";
      empty.textContent = "이번 달 지출 내역이 없습니다.";
      catBreakdown.appendChild(empty);
      return;
    }

    entries.forEach(function (entry) {
      var pct = totalExpense ? Math.round((entry.amount / totalExpense) * 100) : 0;

      var row = document.createElement("div");
      row.className = "cat-row";

      var name = document.createElement("div");
      name.textContent = entry.cat;

      var track = document.createElement("div");
      track.className = "bar-track";
      var fill = document.createElement("div");
      fill.className = "bar-fill";
      fill.style.width = pct + "%";
      track.appendChild(fill);

      var amt = document.createElement("div");
      amt.className = "cat-amount";
      amt.textContent = formatWon(entry.amount) + " (" + pct + "%)";

      row.appendChild(name);
      row.appendChild(track);
      row.appendChild(amt);
      catBreakdown.appendChild(row);
    });
  }

  dateInput.value = todayISO();
  populateCategories();
  render();
})();
</script>
</body>
</html>
